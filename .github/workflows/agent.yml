name: Jane Price Agent

on:
  schedule:
    - cron: '0 8,20 * * *' # יריץ את הסוכן כל יום ב-08:00 וב-20:00
  workflow_dispatch: # מאפשר לך ללחוץ ידנית כדי לבדוק שזה עובד

jobs:
  run-agent:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps chromium

      - name: Run Agent
        env:
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
        run: |
          python jane_agent.py

      - name: Save price history back to repo
        run: |
          git config --global user.name "Price Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add price_history.json
          git commit -m "Auto-update price history" || exit 0
          git push
